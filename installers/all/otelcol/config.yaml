# Claude Code metrics -> local JSONL. Installed by installers/all/install_otelcol.sh
# to ~/.config/otelcol/config.yaml; edit here and re-run the installer.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318
exporters:
  file:
    path: ${env:HOME}/.local/state/otelcol/metrics.jsonl
    create_directory: true
    rotation:
      max_megabytes: 50
      max_days: 30
      max_backups: 20
service:
  telemetry:
    logs:
      level: warn
    metrics:
      level: none
  pipelines:
    metrics:
      receivers: [otlp]
      exporters: [file]
