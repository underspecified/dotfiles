# tank -> Linux hosts with trzsz-ssh: `tssh <host>` opens a mosh-like session
# that survives network drops and roaming. OpenSSH reads every `#!!` line as a
# comment, so plain `ssh` is unaffected.
#
# UdpProxyMode TCP: HRI-JP's Netskope takes over all UDP to these hosts (mosh
# and tssh's default QUIC both time out) and lets TCP through, so the tsshd
# session is carried over TCP. macOS layer only: tank is the one host behind
# Netskope and the one with the tssh client.
#
# tsshd on the hosts: installers/all/install_tsshd.sh. It lands in ~/.local/bin,
# which is on the non-interactive ssh PATH on all five, so no TsshdPath.
Host llm-jp llm-jp-2 haru-4090 haru-5090 dgx02
  #!! UdpMode yes
  #!! UdpProxyMode TCP
