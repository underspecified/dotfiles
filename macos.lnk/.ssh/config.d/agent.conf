# Tank SSH auth: 1Password at the keyboard, on-disk key everywhere else.
#
# IdentityAgent and IdentityFile are ADDITIVE: ssh tries the agent's keys, then
# the file. The fallback only works because 1Password does NOT serve hri_jp
# (~/.config/1Password/ssh/agent.toml, 2026-10-09). ssh treats an agent key and
# a file with the same public key as one identity, so a locked 1Password that
# offered hri_jp and refused to sign it used to block the file entirely.
#
# hri_jp is deliberately passphrase-free so non-interactive sessions work; it is
# machine-local and never tracked in this repo (see .gitignore SECRETS block).
Host *
  IdentityAgent "~/Library/Group Containers/2BUA8C4S2C.com.1password/t/agent.sock"
  IdentityFile ~/.ssh/hri_jp
