# Tank SSH auth: 1Password at the keyboard, on-disk key everywhere else.
#
# IdentityAgent and IdentityFile are ADDITIVE, which is what makes the fallback
# automatic rather than conditional:
#   - 1Password unlocked (you're at the keyboard) -> the agent offers its keys
#     and ssh authenticates via Touch ID.
#   - 1Password locked, quit, or unreachable (ssh INTO tank, cron, headless
#     claude) -> the agent returns ZERO identities, ssh falls straight through
#     to the key below. No hang, no GUI prompt.
#
# hri_jp is deliberately passphrase-free so non-interactive sessions work; it is
# machine-local and never tracked in this repo (see .gitignore SECRETS block).
Host *
  IdentityAgent "~/Library/Group Containers/2BUA8C4S2C.com.1password/t/agent.sock"
  IdentityFile ~/.ssh/hri_jp
