# dgx02 (nosudo host) → fleet dispatch relay via llm-jp.
#
# dgx02 is network-isolated: no Tailscale (policy + blocked), no sudo, and it
# can reach only llm-jp on the work LAN. So all fleet ssh goes through llm-jp
# with ProxyJump; llm-jp resolves the BARE fleet names by MagicDNS at connect
# time, which is what makes this roam-proof (tank's laptop IP can change; the
# name does not). See docs/dispatch-dgx02-relay.md.
#
# Tracking split (names-only, public mirror):
#   - llm-jp's work-LAN HostName lives in the dgx02-local, untracked
#     ~/.ssh/config.d/relay-local.conf — kept off the public mirror AND off the
#     shared honda doc (a HostName override there would force the work-LAN IP on
#     roaming machines like tank). Only auth params are here.
#   - This file ships ONLY via `lnk pull --host nosudo`, so the Mac (where
#     germputer/tank are direct) never sees it.
#
# IdentityFile is explicit on purpose: hri_jp is a non-default key name, and
# non-interactive contexts (the systemd autossh tunnel, dispatch's ssh hops)
# have no agent loaded — without this, ssh offers no key and auth fails.
# (config.d/* is Included before the cross-platform .ssh/config's own
#  `Host germputer` block, so these ProxyJump/User/IdentityFile values win.)

# StrictHostKeyChecking accept-new: TOFU-record each fleet key on first connect,
# verify thereafter. Needed because the autossh tunnels + ProxyJump run
# non-interactively (systemd / dispatch) and can't answer a yes/no prompt; the
# fleet is reached over the authenticated tailnet, so first-use trust is fine.

Host llm-jp
    User eric
    IdentityFile ~/.ssh/hri_jp
    IdentitiesOnly yes
    StrictHostKeyChecking accept-new
    ServerAliveInterval 30
    ServerAliveCountMax 6
    # HostName (work-LAN IP) supplied by the dgx02-local ~/.ssh/config.d/relay-local.conf.

Host germputer tank llm-jp-2
    User eric
    IdentityFile ~/.ssh/hri_jp
    IdentitiesOnly yes
    StrictHostKeyChecking accept-new
    ProxyJump llm-jp
    ServerAliveInterval 30
    ServerAliveCountMax 6
    ControlMaster auto
    ControlPath ~/.ssh/cm-%r@%h:%p
    ControlPersist 10m

# github.com over hri_jp for NON-INTERACTIVE git on nosudo hosts (llm-jp's
# `git pull` / `lnk pull`). Same rationale as above: no agent is loaded outside
# interactive zsh, and hri_jp is a non-default key name — without an explicit
# IdentityFile ssh offers no key and you get
# `git@ssh.github.com: Permission denied (publickey)`. Hostname/Port/User come
# from the cross-platform .ssh/config github stanza (Included after this).
Host github.com
    IdentityFile ~/.ssh/hri_jp
    IdentitiesOnly yes
