# dgx02 (nosudo host) → fleet dispatch relay via llm-jp.
#
# dgx02 is network-isolated: no Tailscale (policy + blocked), no sudo, and it
# can reach only llm-jp on the work LAN. So all fleet ssh goes through llm-jp
# with ProxyJump; llm-jp resolves the BARE fleet names by MagicDNS at connect
# time, which is what makes this roam-proof (tank's laptop IP can change; the
# name does not). See docs/dispatch-dgx02-relay.md.
#
# This file now carries ONLY the dgx02→fleet ProxyJump + connection
# multiplexing. Identity (User, IdentityFile hri_jp, accept-new, keepalives) is
# supplied by the 1P-pulled ~/.ssh/config.d/hri_jp (setup_ssh.sh hri-jp), which
# is Included first. llm-jp's work-LAN HostName comes from the dgx02-local,
# untracked ~/.ssh/config.d/relay-local.conf (kept off the public mirror so a
# HostName override never reaches roaming machines like tank). dgx02 reaches
# llm-jp directly (no ProxyJump) using that HostName + the config.d/hri_jp
# identity. This file ships ONLY via `lnk pull --host nosudo`, so the Mac never
# sees it.

Host germputer tank llm-jp-2
    ProxyJump llm-jp
    ControlMaster auto
    ControlPath ~/.ssh/cm-%r@%h:%p
    ControlPersist 10m
