# host-specified display settings
include display.conf

# Layout
enabled_layouts grid, *

# Behavior
confirm_os_window_close 0
shell zsh
editor zed
allow_remote_control yes
listen_on unix:/tmp/mykitty
linux_display_server auto

# PATH for kitten-launched programs. They bypass the shell, so GUI-launched
# kitty would otherwise hand them its minimal launchd PATH — missing Homebrew
# tools like `mosh` that dispatch's interactive spawn (incl. its inner
# `kitty @ launch -- mosh …`) and the btop/nvtop launchers need. Single source
# of truth is the shell: ~/.config/zsh/.zshrc mirrors the live PATH into
# env.conf. globinclude is optional — silent if the file is absent (e.g. before
# the first interactive shell on a fresh machine). env.conf is machine-local
# (untracked; not in the dotfiles repo).
globinclude env.conf


# Copy/paste: keep left-button selection local even when a TUI grabs the mouse.
# Claude Code reports mouse events, so kitty hands plain drags to the app —
# leaving Cmd+C nothing to copy. Adding `grabbed` to the left-selection maps
# makes drag-select land in kitty's own grid (local; bypasses both the grab and
# mosh), so the normal Mac flow works: drag, then Cmd+C. Scroll wheel still
# reaches the app. Trade-off: a bare left click no longer goes to the app —
# fine for keyboard-driven TUIs.
mouse_map left press        ungrabbed,grabbed mouse_selection normal
mouse_map left doublepress  ungrabbed,grabbed mouse_selection word
mouse_map left triplepress  ungrabbed,grabbed mouse_selection line
mouse_map left click        ungrabbed,grabbed mouse_handle_click selection link prompt

# BEGIN_KITTY_FONTS
font_family      family='iMWritingMono Nerd Font Mono' postscript_name=IMWritingMonoNFM-Regular
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
