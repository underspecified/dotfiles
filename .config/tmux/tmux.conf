set -g mouse on
set -g default-terminal "tmux-256color"
# Advertise 24-bit color to programs inside tmux regardless of the outer terminal
# (kitty on macOS/Linux, rootshell on iOS) so Claude Code themes/statusbars stay
# truecolor instead of falling back to 256-color. Widened from xterm-kitty-only.
set -ag terminal-overrides ",*:RGB"
# Pull COLORTERM into panes on (re)attach, so reattaching an existing session
# after this fix picks up truecolor without recreating the session.
set -ga update-environment "COLORTERM"
set -g escape-time 0
set -g history-limit 50000
set -g focus-events on
set -g set-clipboard on
