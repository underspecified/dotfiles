# Linux-only git settings: config includes this after identity.conf, only for
# repos under /home/, so it overrides identity.conf there and never on macOS.
#
# Sign from the on-disk key, not the agent (2026-10-10): keychain starts an
# empty agent after a reboot, so identity.conf's public-key literal can't sign
# until someone loads the key by hand. Same key, so allowed_signers is
# unchanged. git expands the ~ here (checked on git 2.34, dgx02).
[user]
	signingkey = ~/.ssh/hri_jp
