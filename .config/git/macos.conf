# macOS-only git settings: config includes this after identity.conf, only for
# repos under /Users/, so it overrides identity.conf there and never on Linux.
#
# Sign from the on-disk key, not the agent (Eric, 2026-10-09): 1Password no
# longer serves hri_jp (see ~/.config/1Password/ssh/agent.toml), so a locked
# 1Password can't block commits. Same key, so allowed_signers is unchanged.
[user]
	signingkey = /Users/eric/.ssh/hri_jp
