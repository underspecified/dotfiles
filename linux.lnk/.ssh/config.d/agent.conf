# Agent socket is set by keychain in zshrc.linux (SSH_AUTH_SOCK).
# No IdentityAgent override here — ssh uses SSH_AUTH_SOCK from the env.

# github.com over hri_jp for NON-INTERACTIVE git (`git pull` / `lnk pull` run
# via `ssh <host> '...'`, systemd units, dispatch hops). Those sessions have no
# agent loaded — the keychain agent only exists in interactive zsh — and hri_jp
# is a non-default key name ssh won't offer on its own, so without this you get
# `git@ssh.github.com: Permission denied (publickey)`. IdentitiesOnly so the
# offer isn't masked by other keys. config.d/* is Included before the
# cross-platform .ssh/config github stanza, so this IdentityFile wins; that
# stanza still supplies Hostname (ssh.github.com), Port 443, and User.
Host github.com
    IdentityFile ~/.ssh/hri_jp
    IdentitiesOnly yes
